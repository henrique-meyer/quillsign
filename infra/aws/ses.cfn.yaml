AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated SES identity, feedback destination, and send-only IAM user.
Metadata:
  AWSToolsMetrics:
    AWSToolsVersion: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [../../docs/ses-sandbox-permissions.md]
Parameters:
  IdentityDomain:
    Type: String
  SenderAddress:
    Type: String
  MailFromDomain:
    Type: String
  ConfigurationSetName:
    Type: String
  FeedbackTopicName:
    Type: String
  SenderUserName:
    Type: String
  ProjectTagValue:
    Type: String
  SandboxSenderAddress:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 254
    AllowedPattern: '^$|^[a-z0-9._+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$'
  SandboxFirstSignerAddress:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 254
    AllowedPattern: '^$|^[a-z0-9._+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$'
  SandboxSecondSignerAddress:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 254
    AllowedPattern: '^$|^[a-z0-9._+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$'
  SandboxRecipientAddress:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 254
    AllowedPattern: '^$|^[a-z0-9._+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$'
  EnableFeedbackSubscription:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable only after the exact HTTPS handler and owner-approved rollout are ready.
  FeedbackEndpoint:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[A-Za-z0-9.-]+(?::443)?/webhooks/ses$'
    Description: Private exact application origin plus the fixed signed-feedback path.
Rules:
  SandboxAddressesComplete:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref SandboxSenderAddress, '']
            - !Equals [!Ref SandboxFirstSignerAddress, '']
            - !Equals [!Ref SandboxSecondSignerAddress, '']
            - !Equals [!Ref SandboxRecipientAddress, '']
          - !And
            - !Not [!Equals [!Ref SandboxSenderAddress, '']]
            - !Not [!Equals [!Ref SandboxFirstSignerAddress, '']]
            - !Not [!Equals [!Ref SandboxSecondSignerAddress, '']]
            - !Not [!Equals [!Ref SandboxRecipientAddress, '']]
        AssertDescription: Supply either all four existing verified test addresses or none.
  SandboxAddressesDistinct:
    RuleCondition: !Not [!Equals [!Ref SandboxSenderAddress, '']]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref SandboxSenderAddress, !Ref SandboxFirstSignerAddress]]
          - !Not [!Equals [!Ref SandboxSenderAddress, !Ref SandboxSecondSignerAddress]]
          - !Not [!Equals [!Ref SandboxSenderAddress, !Ref SandboxRecipientAddress]]
          - !Not [!Equals [!Ref SandboxFirstSignerAddress, !Ref SandboxSecondSignerAddress]]
          - !Not [!Equals [!Ref SandboxFirstSignerAddress, !Ref SandboxRecipientAddress]]
          - !Not [!Equals [!Ref SandboxSecondSignerAddress, !Ref SandboxRecipientAddress]]
        AssertDescription: Test mailbox roles must be distinct.
  FeedbackEndpointRequired:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref EnableFeedbackSubscription, 'false']
          - !Not [!Equals [!Ref FeedbackEndpoint, '']]
        AssertDescription: An enabled feedback subscription requires its approved HTTPS endpoint.
Conditions:
  SandboxRecipientsConfigured: !Not [!Equals [!Ref SandboxSenderAddress, '']]
  FeedbackSubscriptionEnabled: !Equals [!Ref EnableFeedbackSubscription, 'true']
Resources:
  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref ConfigurationSetName
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: false
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]
      VdmOptions:
        DashboardOptions:
          EngagementMetrics: DISABLED
        GuardianOptions:
          OptimizedSharedDelivery: DISABLED
      Tags:
        - Key: Project
          Value: !Ref ProjectTagValue
  Identity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref IdentityDomain
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet
      MailFromAttributes:
        MailFromDomain: !Ref MailFromDomain
        BehaviorOnMxFailure: REJECT_MESSAGE
      Tags:
        - Key: Project
          Value: !Ref ProjectTagValue
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Ref FeedbackTopicName
      Tags:
        - Key: Project
          Value: !Ref ProjectTagValue
  FeedbackPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref FeedbackTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
                AWS:SourceArn: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}
  FeedbackDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: FeedbackPolicy
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: feedback
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject, renderingFailure, deliveryDelay]
        SnsDestination:
          TopicARN: !Ref FeedbackTopic
  FeedbackSubscription:
    Type: AWS::SNS::Subscription
    Condition: FeedbackSubscriptionEnabled
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: https
      Endpoint: !Ref FeedbackEndpoint
      RawMessageDelivery: false
      DeliveryPolicy:
        healthyRetryPolicy:
          minDelayTarget: 60
          maxDelayTarget: 60
          numRetries: 5
          numNoDelayRetries: 0
          numMinDelayRetries: 5
          numMaxDelayRetries: 0
          backoffFunction: linear
        throttlePolicy:
          maxReceivesPerSecond: 1
  SenderUser:
    Type: AWS::IAM::User
    # Sandbox identity permissions supplement the sender resource without
    # permitting a different From address or email-management operations.
    Properties:
      UserName: !Ref SenderUserName
      Tags:
        - Key: Project
          Value: !Ref ProjectTagValue
      Policies:
        - PolicyName: send-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${IdentityDomain}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SenderAddress
              - !If
                - SandboxRecipientsConfigured
                - Effect: Allow
                  Action: [ses:SendEmail, ses:SendRawEmail]
                  Resource:
                    - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SandboxSenderAddress}
                    - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SandboxFirstSignerAddress}
                    - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SandboxSecondSignerAddress}
                    - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SandboxRecipientAddress}
                  Condition:
                    StringEquals:
                      ses:FromAddress: !Ref SenderAddress
                    ForAllValues:StringEquals:
                      ses:Recipients:
                        - !Ref SandboxSenderAddress
                        - !Ref SandboxFirstSignerAddress
                        - !Ref SandboxSecondSignerAddress
                        - !Ref SandboxRecipientAddress
                    'Null':
                      ses:Recipients: 'false'
                - !Ref AWS::NoValue
Outputs:
  DkimName1:
    Value: !GetAtt Identity.DkimDNSTokenName1
  DkimValue1:
    Value: !GetAtt Identity.DkimDNSTokenValue1
  DkimName2:
    Value: !GetAtt Identity.DkimDNSTokenName2
  DkimValue2:
    Value: !GetAtt Identity.DkimDNSTokenValue2
  DkimName3:
    Value: !GetAtt Identity.DkimDNSTokenName3
  DkimValue3:
    Value: !GetAtt Identity.DkimDNSTokenValue3
  FeedbackTopicArn:
    Value: !Ref FeedbackTopic
