name: PDF seal validation

on:
  pull_request:
    paths:
      - 'tools/PdfSealSpike/**'
      - 'scripts/dev/Test-PdfSealSpike.ps1'
      - 'docs/pdf-seal-feasibility.md'
      - 'src/QuillSign/Sealing/**'
      - 'src/QuillSign/Completion/**'
      - 'src/QuillSign/Legal/ProductionRetentionDisclosure.cs'
      - 'tests/QuillSign.Tests/ProductionRetentionAdmissionTests.cs'
      - 'tests/QuillSign.Tests/CompletionCertificateRendererTests.cs'
      - 'docs/completion-certificates.md'
      - 'assets/logo-mark.png'
      - 'src/QuillSign/QuillSign.csproj'
      - 'tests/QuillSign.Tests/PlatformPdfSealTests.cs'
      - 'tests/QuillSign.Tests/SealFixtures.cs'
      - 'tests/QuillSign.Tests/*Seal*ProviderTests.cs'
      - 'scripts/dev/Test-PlatformPdfSeal.ps1'
      - 'docs/platform-pdf-seals.md'
      - '.github/workflows/pdf-seal-spike.yml'
  push:
    paths:
      - 'tools/PdfSealSpike/**'
      - 'scripts/dev/Test-PdfSealSpike.ps1'
      - 'docs/pdf-seal-feasibility.md'
      - 'src/QuillSign/Sealing/**'
      - 'src/QuillSign/Completion/**'
      - 'src/QuillSign/Legal/ProductionRetentionDisclosure.cs'
      - 'tests/QuillSign.Tests/ProductionRetentionAdmissionTests.cs'
      - 'tests/QuillSign.Tests/CompletionCertificateRendererTests.cs'
      - 'docs/completion-certificates.md'
      - 'assets/logo-mark.png'
      - 'src/QuillSign/QuillSign.csproj'
      - 'tests/QuillSign.Tests/PlatformPdfSealTests.cs'
      - 'tests/QuillSign.Tests/SealFixtures.cs'
      - 'tests/QuillSign.Tests/*Seal*ProviderTests.cs'
      - 'scripts/dev/Test-PlatformPdfSeal.ps1'
      - 'docs/platform-pdf-seals.md'
      - '.github/workflows/pdf-seal-spike.yml'

permissions:
  contents: read

jobs:
  seal:
    name: PDF seal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exercise offline seal and independent verification
        shell: pwsh
        run: ./scripts/dev/Test-PdfSealSpike.ps1
      - name: Check dependency vulnerabilities
        run: dotnet list tools/PdfSealSpike/PdfSealSpike.csproj package --vulnerable --include-transitive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise Windows checkout line endings in production disclosure source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'src/QuillSign/Legal/ProductionRetentionDisclosure.cs'
          $text = [IO.File]::ReadAllText($source).Replace("`r`n", "`n").Replace("`r", "`n")
          [IO.File]::WriteAllText($source, $text.Replace("`n", "`r`n"))
      - name: Verify production seals independently with generated local certificates
        shell: pwsh
        run: ./scripts/dev/Test-PlatformPdfSeal.ps1
      - name: Verify certificate providers through local cryptography and fake SDK transports
        run: dotnet test tests/QuillSign.Tests/QuillSign.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~SealCertificateProviderTests|FullyQualifiedName~KeyVaultSealProviderTests"
      - name: Verify completion certificates and preserved source pages
        run: dotnet test tests/QuillSign.Tests/QuillSign.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~CompletionCertificateRendererTests"
      - name: Verify canonical production disclosures without SQL or live services
        run: dotnet test tests/QuillSign.Tests/QuillSign.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ProductionRetentionAdmissionContractTests"
