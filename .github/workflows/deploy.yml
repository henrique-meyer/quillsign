name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply migrations through the deployment identity
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          servers=$(az sql server list -g "$AZURE_RESOURCE_GROUP" -o json)
          test "$(jq 'length' <<< "$servers")" = 1
          server=$(jq -r '.[0].name' <<< "$servers")
          fqdn=$(jq -r '.[0].fullyQualifiedDomainName' <<< "$servers")
          databases=$(az sql db list -g "$AZURE_RESOURCE_GROUP" -s "$server" -o json | jq '[.[] | select(.name != "master")]')
          test "$(jq 'length' <<< "$databases")" = 1
          database=$(jq -r '.[0].name' <<< "$databases")
          export ConnectionStrings__Database="Server=tcp:${fqdn},1433;Database=${database};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connect Timeout=90;Pooling=False;"
          dotnet run --project src/QuillSign/QuillSign.csproj -c Release -- database migrate
      - name: Deploy and verify the application
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          app=$(az containerapp list -g "$AZURE_RESOURCE_GROUP" --query "[?tags.component=='web'].name | [0]" -o tsv)
          test -n "$app"
          jobs=$(az containerapp job list -g "$AZURE_RESOURCE_GROUP" --query "[?tags.component=='dispatch' || tags.component=='work-recovery' || tags.component=='purge-recovery'].name" -o tsv)
          while IFS= read -r job; do
            if [ -n "$job" ]; then
              expected="ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA}"
              az containerapp job update -g "$AZURE_RESOURCE_GROUP" -n "$job" --image "$expected" --output none
              actual=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$job" --query properties.template.containers[0].image -o tsv)
              test "$actual" = "$expected"
            fi
          done <<< "$jobs"
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$app" \
            --image "ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA}" \
            --revision-suffix "r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none
          revision=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$app" --query properties.latestRevisionName -o tsv)
          host=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$app" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in {1..30}; do
            healthy=false
            if curl --max-time 30 -fsS "https://$host/health" | jq -e '.status == "ok"'; then healthy=true; fi
            state=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$app" --revision "$revision" --query properties.runningState -o tsv)
            ready=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$app" --query properties.latestReadyRevisionName -o tsv)
            if [ "$state" = Running ] && [ "$ready" = "$revision" ] && [ "$healthy" = true ]; then exit 0; fi
            if [ "$state" = Failed ] || [ "$state" = ActivationFailed ]; then exit 1; fi
            sleep 10
          done
          exit 1
