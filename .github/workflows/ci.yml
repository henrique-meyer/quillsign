name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/hosting.bicep --stdout > /dev/null
          az bicep build --file infra/bootstrap-secrets.bicep --stdout > /dev/null
          az bicep build --file infra/sql-administrator-access.bicep --stdout > /dev/null
          az bicep build --file infra/work.bicep --stdout > /dev/null

  application:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/QuillSign/QuillSign.csproj -c Release
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/QuillSign/QuillSign.csproj
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify pinned PDF.js distribution
        # Vendor checks use only committed bytes and need no credentials or registry access.
        run: python scripts/dev/vendor_pdfjs.py --verify
      - name: Initialize development settings
        shell: pwsh
        run: ./scripts/dev/Initialize-LocalEnvironment.ps1
      - name: Start development services
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Exercise services, isolation, and persistence
        run: python scripts/dev/smoke.py
      - name: Verify migrations, storage, and protected sessions
        shell: pwsh
        run: ./scripts/dev/Use-LocalDatabase.ps1 -Action Test
      - name: Exercise finite work commands
        shell: pwsh
        run: |
          ./scripts/dev/Use-LocalDatabase.ps1 -Action Migrate
          ./scripts/dev/Use-LocalDatabase.ps1 -Action RecoverWork
          ./scripts/dev/Use-LocalDatabase.ps1 -Action WorkOnce
          ./scripts/dev/Use-LocalDatabase.ps1 -Action VerifyWork
          ./scripts/dev/Use-LocalDatabase.ps1 -Action WorkOnce
      - name: Service diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100
      - name: Remove test stack and its volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --log-opts="--all"

  aws-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CloudFormation
        run: |
          python -m pip install cfn-lint==1.57.2
          cfn-lint infra/aws/*.cfn.yaml
