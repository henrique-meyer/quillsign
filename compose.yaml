services:
  app:
    build:
      context: .
      target: development
    environment: &app-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Database: ${ConnectionStrings__Database:-}
      Storage__Provider: Azurite
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=quillsigndev;AccountKey=${AZURITE_ACCOUNT_KEY:?Run scripts/dev/Initialize-LocalEnvironment.ps1 first};BlobEndpoint=http://azurite:10000/quillsigndev;QueueEndpoint=http://azurite:10001/quillsigndev;
      Email__Enabled: "true"
      Email__Provider: Smtp
      Email__FromEmail: noreply@example.invalid
      Email__BaseUrl: http://localhost:${QUILLSIGN_APP_PORT:-5080}
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__UseStartTls: "false"
      Work__Enabled: "true"
      Work__QueueName: work
      Work__HintContainer: work-hints
      Sender__SessionHours: ${Sender__SessionHours:-2}
      Sender__DailyRequests: ${Sender__DailyRequests:-5}
      Sender__RequestsPerWindow: ${Sender__RequestsPerWindow:-20}
      Sender__WindowMinutes: ${Sender__WindowMinutes:-10}
      Documents__MaximumBytes: ${Documents__MaximumBytes:-10485760}
      Documents__MaximumPages: ${Documents__MaximumPages:-20}
    ports:
      - "127.0.0.1:${QUILLSIGN_APP_PORT:-5080}:8080"
    networks: [services, conversion]
    depends_on:
      sql:
        condition: service_healthy
      azurite:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      target: development
    profiles: [workers]
    environment: *app-environment
    command: [work, listen]
    restart: unless-stopped
    networks: [services]
    depends_on:
      sql:
        condition: service_healthy
      azurite:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    platform: linux/amd64
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1536"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/dev/Initialize-LocalEnvironment.ps1 first}
    ports:
      - "127.0.0.1:${QUILLSIGN_SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks: [services]
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 127.0.0.1 --location /data --silent --disableProductStyleUrl
    environment:
      AZURITE_ACCOUNTS: quillsigndev:${AZURITE_ACCOUNT_KEY:?Run scripts/dev/Initialize-LocalEnvironment.ps1 first}
    ports:
      - "127.0.0.1:${QUILLSIGN_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${QUILLSIGN_QUEUE_PORT:-10001}:10001"
    volumes:
      - blob-data:/data
    networks: [services]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const s = require('net').connect(10000, '127.0.0.1', () => { s.end(); process.exit(0); });
          s.on('error', () => process.exit(1)); s.setTimeout(2000, () => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    mem_limit: 2g
    command:
      - gotenberg
      - --chromium-disable-routes
      - --api-disable-download-from
      - --webhook-disable
      - --libreoffice-deny-list=.*
    networks: [conversion]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${QUILLSIGN_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${QUILLSIGN_MAIL_PORT:-8025}:8025"
    volumes:
      - mail-data:/data
    networks: [services]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  services: {}
  conversion:
    internal: true

volumes:
  sql-data:
  blob-data:
  mail-data:
